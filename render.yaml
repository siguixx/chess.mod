services:
  - type: web
    name: chessmod
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CHESS_MOD_JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chessmod-db
          property: connectionString

databases:
  - name: chessmod-db
    plan: free
    databaseName: chessmod
    user: chessmod
